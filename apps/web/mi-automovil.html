<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiAutomóvil | LEPRICES</title><link rel="stylesheet" href="/src/mi-automovil.css"></head>
<body><header><a href="/publico.html">LEPRICES · Gasolineras</a><a class="opcion-menu" href="/rutas.html">Calcular ruta y costo</a><a href="/favoritos.html">Mis favoritos</a><button id="salir" type="button">Cerrar sesión</button></header>
<main id="app" hidden><h1><img src="/images/mi-vehiculo.png" alt="" width="52" height="52"> MiAutomóvil</h1><p id="mensaje" role="status" aria-live="polite"></p>
<section><h2>Registrar mi vehículo</h2><label>Forma de registro<select id="modo"><option value="manual">Ingresar información</option><option value="catalogo">Seleccionar del catálogo</option></select></label>
<form id="registro"><div id="manual" class="campos">
<label>Tipo<select name="tipo"><option value="auto">Automóvil</option><option value="moto">Motocicleta</option></select></label>
<label>Marca<input name="marca" maxlength="100" required></label><label>Modelo<input name="modelo" maxlength="150" required></label><label>Año<input name="anio" type="number" min="1886" required></label>
<label>Motor (cc, opcional)<input name="motorCc" type="number" min="0.1" max="100000" step="0.1"></label>
<label>Transmisión<select name="transmision"><option value="">No especificada</option><option value="manual">Manual</option><option value="automatica">Automática</option><option value="cvt">CVT</option></select></label>
<label>Combustible<select name="combustible"><option value="">No especificado</option><option value="Regular Gasoline">Regular</option><option value="Premium Gasoline">Súper</option><option value="Diesel">Diésel</option><option value="Electricity">Electricidad</option></select></label></div>
<fieldset id="catalogo" hidden disabled><legend>FAXCAR · Catálogo técnico</legend><p>Las versiones y consumos publicados corresponden al mercado de FuelEconomy.gov.</p><div class="campos"><label>Año<select id="year" required></select></label><label>Marca<select id="make" required></select></label><label>Modelo<select id="model" required></select></label><label>Versión<select id="options" required></select></label></div><button id="consultar-catalogo" type="button" disabled>Consultar ficha técnica FAXCAR</button><p id="estado-catalogo" class="estado-catalogo" role="status" aria-live="polite"></p><div id="ficha-catalogo"></div></fieldset>
<div class="campos"><label>Nombre en mi garaje<input name="alias" maxlength="80" required></label><label>Kilometraje actual (km)<input name="kilometrajeInicial" type="number" min="0" max="9999999.9" step="0.1" required></label></div><button id="guardar">Guardar vehículo</button></form></section>
<section><h2>Mi garaje</h2><button id="recargar" type="button">Actualizar</button><div id="garaje"></div></section></main><script type="module" src="/src/mi-automovil.js"></script></body></html>
